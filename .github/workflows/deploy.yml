# Deploys the app to Cloudflare (Worker + frontend + Workflows). Run by hand: Actions → "Деплой" → Run workflow, pick the branch.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Workflows: Edit, Account Settings: Read)
# and CLOUDFLARE_ACCOUNT_ID. Worker variables and secrets set in Cloudflare are kept (keep_vars).
name: Деплой

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: "Применить миграции базы (безопасно: уже применённые пропускаются)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Проверить секреты
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Нет секрета CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Нет секрета CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Миграции базы
        if: ${{ inputs.migrate }}
        run: npx wrangler d1 migrations apply muloqot-books --remote
      - name: Деплой
        run: npx wrangler deploy
